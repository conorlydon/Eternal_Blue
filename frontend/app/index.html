<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eternal Blue — Secure Messaging</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d0d0d;
      color: #e2e2e2;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Auth ─────────────────────────────────────────── */
    #auth {
      display: flex; align-items: center; justify-content: center;
      height: 100vh;
    }
    .auth-card {
      background: #161616; border: 1px solid #242424;
      border-radius: 14px; padding: 2rem;
      width: 100%; max-width: 400px;
    }
    .auth-logo { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
    .auth-logo span { color: #4f9eff; }
    .auth-sub { font-size: 12px; color: #555; margin-bottom: 1.75rem; }

    .tabs { display: flex; gap: 0; border-bottom: 1px solid #242424; margin-bottom: 1.5rem; }
    .tab {
      padding: 8px 18px; font-size: 14px; cursor: pointer;
      color: #555; border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab.active { color: #e2e2e2; border-bottom-color: #4f9eff; }

    label {
      display: block; font-size: 11px; font-weight: 500;
      color: #666; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    input, textarea {
      width: 100%; padding: 9px 12px;
      background: #0d0d0d; border: 1px solid #242424;
      border-radius: 8px; font-size: 14px; color: #e2e2e2;
      margin-bottom: 1rem; font-family: inherit;
    }
    input:focus, textarea:focus { outline: none; border-color: #4f9eff; }
    textarea { resize: vertical; }

    .btn {
      width: 100%; padding: 9px;
      background: #4f9eff; color: #fff; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: #3d8ef0; }
    .btn:disabled { background: #1b3a6b; color: #4a7abf; cursor: not-allowed; }
    .btn-ghost {
      background: transparent; color: #888; border: 1px solid #242424;
    }
    .btn-ghost:hover { background: #1a1a1a; color: #e2e2e2; }

    .form-error {
      padding: 8px 12px; background: #1f1010; border: 1px solid #3d1515;
      border-radius: 6px; font-size: 13px; color: #f87171;
      margin-bottom: 1rem; display: none;
    }
    .form-hint {
      font-size: 11px; color: #555; margin-top: -0.75rem; margin-bottom: 1rem;
    }

    /* ── App layout ──────────────────────────────────── */
    #app { display: none; height: 100vh; flex-direction: column; }

    .app-header {
      display: flex; align-items: center;
      padding: 0 1.25rem; height: 50px;
      border-bottom: 1px solid #1a1a1a; flex-shrink: 0; gap: 0.75rem;
    }
    .app-logo { font-size: 16px; font-weight: 700; }
    .app-logo span { color: #4f9eff; }
    .header-user { margin-left: auto; font-size: 12px; color: #555; }
    .btn-sm {
      padding: 5px 11px; font-size: 12px;
      background: #1a1a1a; border: 1px solid #242424;
      border-radius: 6px; color: #888; cursor: pointer;
    }
    .btn-sm:hover { color: #e2e2e2; border-color: #3a3a3a; }

    .app-body { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ─────────────────────────────────────── */
    .sidebar {
      width: 270px; border-right: 1px solid #1a1a1a;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-head {
      padding: 0.875rem 1rem; border-bottom: 1px solid #1a1a1a;
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-title { font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.06em; }
    .btn-icon {
      width: 26px; height: 26px; background: #1a1a1a;
      border: 1px solid #242424; border-radius: 6px;
      color: #888; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-icon:hover { color: #e2e2e2; border-color: #3a3a3a; }

    .conv-list { flex: 1; overflow-y: auto; }
    .conv-item {
      padding: 10px 14px; cursor: pointer;
      border-bottom: 1px solid #0f0f0f;
      display: flex; align-items: center; gap: 9px;
    }
    .conv-item:hover { background: #141414; }
    .conv-item.active { background: #122040; }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: #1b3560; display: flex; align-items: center;
      justify-content: center; font-size: 13px; font-weight: 600;
      color: #4f9eff; flex-shrink: 0; text-transform: uppercase;
    }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-size: 13px; font-weight: 500; }
    .conv-preview {
      font-size: 11px; color: #555; margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .conv-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .conv-time { font-size: 10px; color: #444; }
    .unread { background: #4f9eff; color: #fff; border-radius: 99px; padding: 1px 6px; font-size: 10px; font-weight: 700; }

    /* ── Main panel ──────────────────────────────────── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #333;
    }
    .empty-state .icon { font-size: 42px; margin-bottom: 0.75rem; }
    .empty-state p { font-size: 14px; }

    .chat-header {
      padding: 0 1.25rem; height: 50px;
      border-bottom: 1px solid #1a1a1a;
      display: flex; align-items: center; gap: 9px; flex-shrink: 0;
    }
    .chat-name { font-size: 14px; font-weight: 600; }
    .chat-sub { font-size: 11px; color: #555; }

    .messages-area {
      flex: 1; overflow-y: auto;
      padding: 1.25rem; display: flex; flex-direction: column; gap: 10px;
    }

    .msg { display: flex; flex-direction: column; max-width: 68%; }
    .msg.mine { align-self: flex-end; align-items: flex-end; }
    .msg.theirs { align-self: flex-start; align-items: flex-start; }

    .msg-bubble {
      padding: 9px 13px; border-radius: 12px;
      font-size: 14px; line-height: 1.5; word-break: break-word;
    }
    .msg.mine .msg-bubble { background: #1a3a6a; border-bottom-right-radius: 3px; }
    .msg.theirs .msg-bubble { background: #1a1a1a; border-bottom-left-radius: 3px; }
    .msg.error .msg-bubble { background: #1f1010; color: #f87171; font-size: 12px; font-style: italic; }
    .msg-forwarded-tag { font-size: 10px; color: #555; font-style: italic; margin-bottom: 3px; }

    .msg-meta {
      font-size: 10px; color: #444; margin-top: 3px;
      display: flex; align-items: center; gap: 5px;
    }
    .lock { color: #4f9eff; }

    .msg-actions { display: none; gap: 3px; margin-top: 4px; }
    .msg:hover .msg-actions { display: flex; }
    .act-btn {
      padding: 2px 7px; font-size: 10px;
      background: transparent; border: 1px solid #242424;
      border-radius: 4px; color: #666; cursor: pointer;
    }
    .act-btn:hover { color: #e2e2e2; border-color: #3a3a3a; }
    .act-btn.danger:hover { color: #f87171; border-color: #3d1515; }

    /* ── Compose ─────────────────────────────────────── */
    .compose {
      padding: 0.875rem 1.25rem;
      border-top: 1px solid #1a1a1a; flex-shrink: 0;
    }
    .compose-row { display: flex; gap: 7px; align-items: flex-end; }
    .compose-input {
      flex: 1; padding: 9px 13px;
      background: #161616; border: 1px solid #242424;
      border-radius: 10px; font-size: 14px; color: #e2e2e2;
      resize: none; min-height: 38px; max-height: 120px;
      font-family: inherit; line-height: 1.5;
    }
    .compose-input:focus { outline: none; border-color: #4f9eff; }
    .btn-send {
      width: 38px; height: 38px; background: #4f9eff;
      border: none; border-radius: 10px;
      color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-send:hover { background: #3d8ef0; }
    .btn-send:disabled { background: #1b3a6b; cursor: not-allowed; }

    /* ── Modal ───────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .overlay[hidden] { display: none; }
    .modal {
      background: #161616; border: 1px solid #242424;
      border-radius: 12px; padding: 1.5rem; width: 360px;
    }
    .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 1rem; }
    .modal-btns { display: flex; gap: 8px; margin-top: 0.5rem; }
    .modal-btns .btn { flex: 1; }

    /* ── Toast ───────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%);
      padding: 9px 18px; border-radius: 8px;
      font-size: 13px; z-index: 100; display: none;
      border: 1px solid #242424; background: #161616;
    }
    #toast.err { border-color: #3d1515; color: #f87171; }
    #toast.ok  { border-color: #1a3d1a; color: #4ade80; }

    /* ── Scrollbar ───────────────────────────────────── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #242424; border-radius: 2px; }

    /* ── Loading spinner ─────────────────────────────── */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #333; border-top-color: #4f9eff;
      border-radius: 50%; animation: spin 0.6s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-row {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 2rem; color: #555; font-size: 13px;
    }

    .tofu-warn {
      padding: 9px 12px; background: #1f1a00; border: 1px solid #4a3800;
      border-radius: 8px; font-size: 12px; color: #facc15;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<!-- ════ AUTH SCREEN ════════════════════════════════════════════════════ -->
<div id="auth">
  <div class="auth-card">
    <div class="auth-logo">Eternal <span>Blue</span></div>
    <div class="auth-sub">End-to-end encrypted messaging</div>

    <div class="tabs">
      <div class="tab active" id="tab-login">Login</div>
      <div class="tab" id="tab-register">Register</div>
    </div>

    <!-- Login form -->
    <div id="form-login">
      <div class="form-error" id="login-err"></div>
      <label for="l-user">Username</label>
      <input id="l-user" type="text" placeholder="your_username" autocomplete="username" />
      <label for="l-pass">Password</label>
      <input id="l-pass" type="password" placeholder="••••••••••••" autocomplete="current-password" />
      <button class="btn" id="login-btn">Login</button>
    </div>

    <!-- Register form -->
    <div id="form-register" style="display:none">
      <div class="form-error" id="reg-err"></div>
      <label for="r-user">Username</label>
      <input id="r-user" type="text" placeholder="3–32 chars, letters/numbers/_" autocomplete="username" />
      <label for="r-pass">Password</label>
      <input id="r-pass" type="password" placeholder="Min 12 characters" autocomplete="new-password" />
      <div class="form-hint">A new X25519 keypair will be generated and stored locally.</div>
      <button class="btn" id="reg-btn">Create account</button>
    </div>
  </div>
</div>

<!-- ════ APP SCREEN ══════════════════════════════════════════════════════ -->
<div id="app">
  <header class="app-header">
    <div class="app-logo">Eternal <span>Blue</span></div>
    <span class="header-user" id="header-user"></span>
    <button class="btn-sm" id="change-pass-btn">Change password</button>
    <button class="btn-sm" id="logout-btn">Logout</button>
  </header>

  <div class="app-body">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">Conversations</span>
        <button class="btn-icon" id="new-conv-btn" title="New conversation">+</button>
      </div>
      <div class="conv-list" id="conv-list">
        <div class="loading-row"><span class="spinner"></span> Loading…</div>
      </div>
    </div>

    <!-- Main panel -->
    <div class="main" id="main">
      <div class="empty-state" id="empty-state">
        <div class="icon">🔒</div>
        <p>Select a conversation or start a new one</p>
      </div>

      <!-- Chat view (hidden until conversation selected) -->
      <div id="chat-view" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
        <div class="chat-header">
          <div class="avatar" id="chat-avatar"></div>
          <div>
            <div class="chat-name" id="chat-name"></div>
            <div class="chat-sub">End-to-end encrypted</div>
          </div>
        </div>
        <div class="messages-area" id="messages-area"></div>
        <div class="compose">
          <div class="compose-row">
            <textarea class="compose-input" id="compose-input"
              placeholder="Message (encrypted end-to-end)…"
              rows="1"></textarea>
            <button class="btn-send" id="send-btn" title="Send">&#10148;</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ════ NEW CONVERSATION MODAL ═════════════════════════════════════════ -->
<div class="overlay" id="new-conv-modal" hidden>
  <div class="modal">
    <div class="modal-title">New conversation</div>
    <div class="form-error" id="new-conv-err"></div>
    <label for="new-conv-user">Recipient username</label>
    <input id="new-conv-user" type="text" placeholder="username" />
    <div class="modal-btns">
      <button class="btn btn-ghost" id="cancel-new-conv-btn">Cancel</button>
      <button class="btn" id="start-conv-btn">Start</button>
    </div>
  </div>
</div>

<!-- ════ FORWARD MODAL ══════════════════════════════════════════════════ -->
<div class="overlay" id="forward-modal" hidden>
  <div class="modal">
    <div class="modal-title">Forward message</div>
    <div class="form-error" id="fwd-err"></div>
    <label for="fwd-user">Forward to username</label>
    <input id="fwd-user" type="text" placeholder="username" />
    <div class="modal-btns">
      <button class="btn btn-ghost" id="cancel-fwd-btn">Cancel</button>
      <button class="btn" id="do-fwd-btn">Forward</button>
    </div>
  </div>
</div>

<!-- ════ CHANGE PASSWORD MODAL ══════════════════════════════════════════ -->
<div class="overlay" id="change-pass-modal" hidden>
  <div class="modal">
    <div class="modal-title">Change password</div>
    <div class="form-error" id="change-pass-err"></div>
    <label for="cp-current">Current password</label>
    <input id="cp-current" type="password" placeholder="Current password" autocomplete="current-password" />
    <label for="cp-new">New password</label>
    <input id="cp-new" type="password" placeholder="Min 12 characters" autocomplete="new-password" />
    <label for="cp-confirm">Confirm new password</label>
    <input id="cp-confirm" type="password" placeholder="Repeat new password" autocomplete="new-password" />
    <div class="modal-btns">
      <button class="btn btn-ghost" id="cancel-change-pass-btn">Cancel</button>
      <button class="btn" id="do-change-pass-btn">Update password</button>
    </div>
  </div>
</div>

<!-- ════ TOAST ══════════════════════════════════════════════════════════ -->
<div id="toast"></div>

<!-- Resolve the npm-installed HPKE library (served from /vendor) for the browser.
     @hpke/core and @hpke/chacha20poly1305 import @hpke/common internally, so all
     three bare specifiers are mapped here. No CDN, no bundler. -->
<script type="importmap">
{
  "imports": {
    "@hpke/core": "/vendor/@hpke/core/esm/mod.js",
    "@hpke/chacha20poly1305": "/vendor/@hpke/chacha20poly1305/esm/mod.js",
    "@hpke/common": "/vendor/@hpke/common/esm/mod.js"
  }
}
</script>
<script type="module" src="/app/app.js"></script>
</body>
</html>
